<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Catálogo DS A Fonte — camisas, polos e artigos esportivos. Solicite orçamento via WhatsApp.">
  <meta name="author" content="João Victor Seki Mantovani (JVSEKI)">
  <title>Catálogo | DS A Fonte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
</head>
<body data-page="catalogo">

  <div class="watermark-bg" aria-hidden="true"></div>

  <main>
    <section class="page-hero">
      <div class="container page-hero__content">
        <span class="section-tag">Catálogo</span>
        <h1 class="page-hero__title">Nossos Produtos</h1>
        <p class="page-hero__desc">Selecione uma categoria, escolha o tamanho e solicite seu orçamento.</p>
      </div>
    </section>

    <section class="catalog">
      <div class="container">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="todos">Todos</button>
          <button class="filter-btn" data-filter="selecao">Seleção</button>
          <button class="filter-btn" data-filter="times">Times BR</button>
          <button class="filter-btn" data-filter="casual">Casual</button>
          <button class="filter-btn" data-filter="f1">F1</button>
        </div>
        <div class="catalog__grid" id="catalogGrid"></div>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
